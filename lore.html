<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lore — TRAME (privé)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:wght@400;500;600;700" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --parchment: #e3d5b8;
            --dark-ink: #1c1917;
            --accent: #7c2d12;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
            color: var(--dark-ink);
            background-color: #2c2520;
            background-image: url("https://www.transparenttextures.com/patterns/wood-pattern.png");
        }

        h1, h2, h3, h4 { font-family: 'Cinzel', serif; letter-spacing: 0.05em; }

        #gate {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(44, 37, 32, 0.92);
            z-index: 1000;
        }

        .gate-box {
            background: #f4ecd8;
            background-image: url("parchment.png");
            border: 3px solid #1c1917;
            border-radius: 8px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 90%;
        }

        .gate-box h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #1c1917;
        }

        .gate-box p {
            font-size: 1.05rem;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        #passwordInput {
            width: 100%;
            padding: 12px 16px;
            font-size: 1.1rem;
            font-family: 'Cormorant Garamond', serif;
            border: 2px solid #1c1917;
            border-radius: 6px;
            background: rgba(255,255,255,0.85);
            margin-bottom: 18px;
            text-align: center;
            letter-spacing: 0.05em;
        }

        #passwordInput:focus {
            outline: none;
            border-color: #7c2d12;
            box-shadow: 0 0 0 3px rgba(124, 45, 18, 0.2);
        }

        #unlockBtn {
            background: #7c2d12;
            color: #f4ecd8;
            border: none;
            padding: 12px 32px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.05em;
        }

        #unlockBtn:hover {
            background: #9a3b1a;
            transform: translateY(-1px);
        }

        #errorMsg {
            color: #7c2d12;
            font-size: 0.95rem;
            margin-top: 12px;
            min-height: 1.4em;
            font-style: italic;
        }

        #content {
            display: none;
            height: 100%;
            width: 100%;
            overflow: hidden;
            flex-direction: column;
        }

        .lore-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 50px;
        }

        .lore-page {
            max-width: 820px;
            margin: 0 auto;
            background: #e3d5b8;
            background-image: url("parchment.png");
            padding: 45px 55px 70px;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.45);
            position: relative;
            min-height: calc(100% - 20px);
        }

        .lore-page h1 {
            font-size: 1.9rem;
            border-bottom: 2px solid #1c1917;
            padding-bottom: 0.55rem;
            margin-bottom: 1.4rem;
        }

        .lore-page h2 {
            font-size: 1.4rem;
            border-bottom: 1px solid rgba(28,25,23,0.4);
            padding-bottom: 0.35rem;
            margin: 2rem 0 0.9rem;
        }

        .lore-page h3 {
            font-size: 1.15rem;
            margin: 1.6rem 0 0.6rem;
            color: #1c1917;
            border-left: 3px solid #7c2d12;
            padding-left: 0.75rem;
        }

        .lore-page h4 {
            font-size: 1.05rem;
            margin: 1.3rem 0 0.45rem;
            font-weight: 700;
        }

        .lore-page p {
            margin-bottom: 0.95rem;
            line-height: 1.7;
            font-size: 1.08rem;
        }

        .lore-page ul, .lore-page ol {
            margin: 0.9rem 0 1.1rem 1.5rem;
        }

        .lore-page li {
            margin-bottom: 0.35rem;
            line-height: 1.6;
        }

        .lore-page blockquote {
            border-left: 4px solid #7c2d12;
            background: rgba(124, 45, 18, 0.06);
            padding: 0.75rem 1.1rem;
            margin: 1.1rem 0;
            font-style: italic;
        }

        .lore-page hr {
            border: none;
            border-top: 1px solid rgba(28,25,23,0.25);
            margin: 1.8rem 0;
        }

        .lore-page strong {
            color: #7c2d12;
        }

        .lore-page table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.2rem 0;
            font-size: 0.95rem;
        }

        .lore-page th, .lore-page td {
            border: 1px solid rgba(28,25,23,0.25);
            padding: 0.45rem 0.6rem;
            text-align: left;
        }

        .lore-page th {
            background: rgba(124, 45, 18, 0.1);
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
        }

        .legal {
            position: absolute;
            bottom: 1rem;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 0.5rem;
            color: rgba(28, 25, 23, 0.5);
        }

        @media (max-width: 700px) {
            .lore-page {
                padding: 28px 20px 55px;
            }
            .lore-page h1 { font-size: 1.5rem; }
            .gate-box { padding: 30px 25px; }
        }
    </style>
</head>
<body>

    <div id="gate">
        <div class="gate-box">
            <h2>🕯️ Lore</h2>
            <p>Archives privées du Codex TRAME</p>
            <input type="password" id="passwordInput" placeholder="Mot de passe" autocomplete="off" autofocus>
            <br>
            <button id="unlockBtn">Ouvrir les archives</button>
            <div id="errorMsg"></div>
        </div>
    </div>

    <div id="content">
        <div class="lore-scroll">
            <div class="lore-page">
                <div id="markdownContent">Chargement…</div>
                <div class="legal">© 2026 Urnidzen — Archives privées</div>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = "Trame-lore";
        const STORAGE_KEY = "trame_lore_unlocked";

        const ANNEXES = {
            "1": "lore/Annexe1-Atlas.md",
            "2": "lore/Annexe2-Aventures.md",
            "3": "lore/Annexe3-Personnages.md"
        };

        // Lire le paramètre ?annex=1|2|3 (défaut = 1)
        const params = new URLSearchParams(window.location.search);
        let currentAnnex = params.get("annex") || "1";
        if (!ANNEXES[currentAnnex]) currentAnnex = "1";

        if (sessionStorage.getItem(STORAGE_KEY) === "true") {
            unlock();
        }

        document.getElementById("unlockBtn").addEventListener("click", tryUnlock);
        document.getElementById("passwordInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") tryUnlock();
        });

        // Écouter les changements de paramètre si le parent change l'URL de l'iframe
        window.addEventListener("message", (e) => {
            if (e.data && e.data.action === "loadAnnex" && ANNEXES[e.data.annex]) {
                currentAnnex = e.data.annex;
                if (sessionStorage.getItem(STORAGE_KEY) === "true") {
                    loadAnnex(ANNEXES[currentAnnex]);
                }
            }
        });

        function tryUnlock() {
            const input = document.getElementById("passwordInput").value;
            const error = document.getElementById("errorMsg");

            if (input === CORRECT_PASSWORD) {
                sessionStorage.setItem(STORAGE_KEY, "true");
                unlock();
            } else {
                error.textContent = "Mot de passe incorrect";
                document.getElementById("passwordInput").value = "";
                document.getElementById("passwordInput").focus();
            }
        }

        function unlock() {
            document.getElementById("gate").style.display = "none";
            document.getElementById("content").style.display = "flex";
            loadAnnex(ANNEXES[currentAnnex]);
        }

        async function loadAnnex(file) {
            const container = document.getElementById("markdownContent");
            container.innerHTML = "<p style='opacity:0.6;font-style:italic'>Chargement…</p>";
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error("Fichier introuvable");
                const text = await response.text();
                container.innerHTML = marked.parse(text);
                document.querySelector(".lore-scroll").scrollTop = 0;
            } catch (err) {
                container.innerHTML = "<p style='color:#7c2d12'>Impossible de charger cette annexe.</p>";
            }
        }
    </script>
</body>
</html>
