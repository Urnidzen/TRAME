    <style>
        :root {
            --parchment: #e3d5b8;
            --dark-ink: #1c1917;
            --accent: #7c2d12;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
  
        html, body { 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
        }

        body {
            background-color: #2c2520;
            background-image: url("https://www.transparenttextures.com/patterns/wood-pattern.png");
            font-family: 'Cormorant Garamond', serif;
            color: var(--dark-ink);
            line-height: 1.6;
        }

        h1, h2, h3, h4, .font-cinzel { font-family: 'Cinzel', serif; letter-spacing: 0.05em; }

        /* ===== EXEMPLES ===== */
        /* Teinte gris très clair pour les cartes d'exemples */
        .card-start.exemple,
        .rule-item.exemple,
        .card-end.exemple {
            background: rgba(28, 25, 23, 0.06); /* Mute le parchemin vers un gris doux et transparent */
        }
        
        /* Optionnel : Légère mise en valeur terracotta sobre pour les intervenants */
        .rule-item.exemple p strong {
            color: var(--accent);
        }

        /* ===== SIDEBAR ===== */
        .sidebar-container {
            position: fixed;
            left: 0; top: 0; height: 100vh;
            z-index: 100;
            display: flex;
            transform: translateX(0);
            transition: transform 0.3s ease;
        }

        .sidebar-container.closed { transform: translateX(-320px); }

        .sidebar {
            width: 320px;
            height: 100%;
            background: #f4ecd8;
            background-image: url("parchment.png");
            border-right: 3px solid #1c1917;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.3);
        }

        .tab-handle {
            width: 25px; height: 105px;
            background: #f5f5f0;
            border: 2px solid #1c1917;
            border-left: none;
            border-radius: 0 12px 12px 0;
            align-self: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 0 10px rgba(0,0,0,0.4);
            transition: all 0.2s;
            margin-left: -2px;
        }

        .tab-handle:hover { background: #ffffff; }

        .tab-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            color: #1c1917;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            transform: rotate(180deg);
            text-align: center;
            line-height: 1.2;
        }

        .search-container {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0,0,0,0.2);
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #1c1917;
            border-radius: 6px;
            background: rgba(255,255,255,0.9);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
        }

        .doc-item { margin-bottom: 8px; }

        .doc-header {
            display: flex; align-items: center; gap: 10px;
            padding: 12px;
            background: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .doc-header:hover { background: rgba(124, 45, 18, 0.1); }
        .doc-header.active { background: rgba(124, 45, 18, 0.2); border-left: 4px solid #7c2d12; }

        .doc-icon { font-size: 1.2rem; }
        .doc-title { font-family: 'Cinzel', serif; font-weight: 700; font-size: 0.9rem; }
        .doc-subtitle { font-size: 0.75rem; opacity: 0.7; margin-top: 2px; }

        .doc-index {
            margin-top: 8px; margin-left: 10px; padding-left: 15px;
            border-left: 2px solid rgba(0,0,0,0.1);
            display: none;
        }

        .doc-index.expanded { display: block; }

        .index-item {
            padding: 8px 10px; font-size: 0.85rem; cursor: pointer;
            border-radius: 4px; transition: all 0.2s; margin-bottom: 4px;
        }

        .index-item:hover { background: rgba(124, 45, 18, 0.1); padding-left: 15px; }
        .index-item.expanded { background: rgba(124, 45, 18, 0.15); font-weight: 600; }

        /* ===== MAIN CONTAINER & BOOK SPREADS ===== */
        .main-container {
            margin-left: 320px; 
            height: 100vh;
            width: calc(100% - 320px);
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            transition: margin-left 0.3s, width 0.3s;
            scrollbar-width: none; 
            -ms-overflow-style: none;
            background-color: #2c2520;
            background-image: url("https://www.transparenttextures.com/patterns/wood-pattern.png");
        }
        
        .main-container::-webkit-scrollbar { display: none; }
        .main-container.sidebar-closed { margin-left: 0; width: 100%; }

        .book-spreads-wrapper {
            display: flex; flex-direction: column; width: 100%;
        }

        .book-spread {
            display: flex; 
            gap: 0; 
            width: calc(100% - 60px);
            height: calc(100vh - 60px);
            margin: 30px auto;
            scroll-snap-align: center;
            scroll-snap-stop: always; 
            flex-shrink: 0; 
            position: relative;
            border-radius: 8px;
            box-shadow: 
                0 10px 40px rgba(0,0,0,0.6),
                0 0 0 1px rgba(0,0,0,0.2);
            overflow: hidden;
            background: #1a1612;
            z-index: 1;
        }

        .page {
            flex: 1; height: 100%;
            background: #e3d5b8;
            background-image: url("parchment.png");
            padding: 50px 60px 80px 60px;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: flex-start;
        }

        .page-left { 
            border-right: 1px solid rgba(0,0,0,0.1); 
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.05); 
        }
        .page-right { 
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.05); 
        }

        .content-wrapper { 
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* ===== TYPOGRAPHIE & TITRES ===== */
        .content-section { margin-bottom: 1.5rem; }
        .content-section h2, .page h2 {
            font-size: 1.5rem;
            border-bottom: 2px solid #1c1917;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            margin-top: 3.5rem;
        }

        .content-section h3, .page h3 {
            font-size: 1.25rem;
            border-bottom: 1px solid rgba(28, 25, 23, 0.4);
            padding-bottom: 0.3rem;
            margin-bottom: 0.8rem;
            margin-top: 3rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.05em;
            color: #1c1917;
        }
        
        .content-section h4, .page h4 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            margin-top: 2.5rem;
            color: #1c1917;
            border-left: 3px solid #7c2d12;
            padding-left: 0.8rem;
            font-family: 'Cinzel', serif;
        }

        .page h2:first-child,
        .page h3:first-child, 
        .page h4:first-child {
            margin-top: 0 !important;
        }

        .page .content-wrapper table + h2,
        .page .content-wrapper table + h3,
        .page .content-wrapper table + .section-title-isolated {
            margin-top: 3.2rem !important;
        }

        .section-title-isolated {
            font-size: 1.5rem;
            border-bottom: 2px solid #1c1917;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.05em;
        }

        /* ===== LISTES ===== */
        ul, ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }
        li {
            margin-bottom: 0.3rem;
        }

        .dash-list {
            list-style: none;
            padding-left: 0;
        }
        
        .dash-list li {
            padding-left: 20px;
            position: relative;
            margin-bottom: 0.5rem;
        }
        
        .dash-list li:before {
            content: "—";
            position: absolute;
            left: 0;
            color: #7c2d12;
            font-weight: bold;
        }
        
        .list-two-columns {
            column-count: 2;
            column-gap: 2rem;
        }

        .list-two-columns li {
            break-inside: avoid;
            margin-bottom: 0.5rem;
        }

        /* Pseudo-listes (pour la pagination) */
        .pseudo-li {
            padding-left: 20px;
            position: relative;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .pseudo-li:before {
            content: "—";
            position: absolute;
            left: 0;
            color: #7c2d12;
            font-weight: bold;
        }

        .pseudo-li-level2 {
            padding-left: 40px !important;
            position: relative;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .pseudo-li-level2:before {
            content: "—";
            position: absolute;
            left: 20px;
            color: #7c2d12;
            font-weight: bold;
        }

        /* ===== CARDS & CONTAINERS ===== */
        .content-card {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 1.2rem; 
            margin-bottom: 1.2rem; 
            border-radius: 4px;
        }

        .rule-box { 
            border-left: 4px solid #7c2d12; 
            background: rgba(124, 45, 18, 0.05); 
            padding: 1rem; 
            margin: 1.2rem 0; 
        }

        /* Simulation visuelle des content-cards avec des lignes successives */
        .card-start {
            border-top: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.3);
            padding-left: 1.2rem;
            padding-right: 1.2rem;
            padding-top: 0.5rem;
            border-radius: 4px 4px 0 0;
            margin-top: 1rem;
            margin-bottom: 0;
        }
        
        .card-line {
            border-left: 4px solid #7c2d12;
            background: rgba(255,255,255,0.3);
            padding-left: 1.2rem;
            padding-right: 1.2rem;
            margin: 0;
        }
        
        .card-end {
            background: rgba(255,255,255,0.3);
            padding-left: 1.2rem;
            padding-right: 1.2rem;
            padding-bottom: 0.5rem;
            border-radius: 0 0 4px 4px;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        /* ===== STRUCTURE "PLAQUÉE" (éléments individuels découpables) ===== */
        .rule-item, .table-row, .card-line {
            display: block;
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }
             
        .rule-item {
            background: rgba(255,255,255,0.3);
            padding-left: 1.2rem;
            padding-right: 1.2rem;
            padding-top: 0.3rem;
            padding-bottom: 0.3rem;
            margin-left: 0;
            margin-bottom: 0;
        }
        
        .table-row {
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 0.4rem 0;
        }

        .empty-line {
            display: block;
            height: 1.6rem;
            width: 100%;
        }

        /* ===== IMAGES ===== */
        img {
            max-width: 100%; 
            height: auto; 
            display: block;
        }

        /* ===== FICHES PERSONNAGES ===== */
        .sheet-container-frame {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .char-sheet-frame {
            background: transparent;
            border: none;
            width: 794px;
            height: 1123px;
        }

        .sheet-placeholder-text {
            font-family: 'Cinzel', serif; 
            text-align: center; 
            color: #7c2d12;
            margin-top: 30vh;
            padding: 0 40px;
        }

        .new-char-btn {
            background: transparent;
            border: 2px solid #7c2d12;
            color: #7c2d12;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            padding: 15px 30px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .new-char-btn:hover {
            background: #7c2d12;
            color: #f4ecd8;
        }

        .big-plus { font-size: 2rem; }

        /* ===== FOOTER ===== */
        .legal-notice {
            position: absolute;
            bottom: 0.8rem;
            left: 0;  
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 0.4rem;
            color: rgba(28, 25, 23, 0.6);
            pointer-events: none;
            line-height: 1.4;
            padding: 0px 20px;
            z-index: 10;
        }

        .page-number {
            position: absolute;
            bottom: 1.8rem;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: rgba(28, 25, 23, 0.5);
            pointer-events: none;
            z-index: 10;
            padding-bottom: 0; 
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .sidebar-container { transform: translateX(-320px); }
            .sidebar-container:not(.closed) { transform: translateX(0); }
            
            .main-container { 
                margin-left: 0 !important; 
                width: 100% !important;
                height: 100dvh;
                scroll-snap-type: y mandatory;
            }
            
            .book-spread {
                width: calc(100% - 20px);
                height: calc(100dvh - 20px);
                margin: 10px auto;
                border-radius: 4px;
                scroll-snap-align: start;
                scroll-snap-stop: always;
                scroll-margin: 10px 0;
            }
            
            .page { 
                padding: 30px 20px 60px 20px; 
                width: 100%; 
                height: 100%;
                min-height: unset;
                display: flex;
                flex-direction: column;
            }
            
            .page-right { display: none; }
            
            .book-spread.sheet-mode .page-left { display: none; }
            .book-spread.sheet-mode .page-right { 
                display: flex; 
                width: 100%; 
                height: 100%;
            }
        }

        /* ===== PRINT ===== */
        @media print {
            @page {
               margin: 0;
            }
            
            html, body, .main-container, .book-spreads-wrapper {
                height: auto !important;
                overflow: visible !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background: none !important;
            }

            .sidebar-container, .tab-handle, #searchInput, .new-char-btn {
                display: none !important;
            }

            .book-spread {
                display: block !important;
                width: 100% !important;
                height: auto !important;
                margin: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                page-break-after: always !important;
                break-after: page !important;
            }

            .book-spread:last-of-type {
                page-break-after: auto !important;
                break-after: auto !important;
            }

            .page {
                height: 297mm !important;
                min-height: 297mm !important;
                width: 210mm !important;
                position: relative !important;
                display: block !important;
                border: none !important;
                box-shadow: none !important;
                margin: 0 auto !important;
                padding: 1cm 1cm 2.5cm 1cm !important;
                box-sizing: border-box !important;
                overflow: hidden !important;
                page-break-inside: avoid !important;
                page-break-after: always !important;
                break-after: page !important;
            }

            .legal-notice {
                position: absolute !important;
                bottom: 0.8cm !important;
                left: 0 !important;
                width: 100% !important;
                text-align: center !important;
                margin: 0 !important;
                padding: 0 !important;
                font-size: 8pt !important;
            }
        
            .page-number {
                position: absolute !important;
                bottom: 1.8cm !important;
                left: 0 !important;
                width: 100% !important;
                text-align: center !important;
                margin: 0 !important;
                padding: 0 !important;
                font-size: 10pt !important;
            }
        
            .content-wrapper {
                height: calc(100% - 2.5cm) !important;
                overflow: hidden !important;
            }

            .page:last-of-type {
                page-break-after: auto !important;
                break-after: auto !important;
            }

            .page-left, .page-right {
                display: block !important;
            }

            .sheet-container-frame {
                position: relative !important;
                width: 794px !important;
                height: 1123px !important;
                overflow: hidden !important;
                margin: 0 auto !important;
                page-break-inside: avoid !important;
            }
    
            .char-sheet-frame {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                transform: none !important;
                width: 794px !important;
                height: 1123px !important;
                box-shadow: none !important;
                margin: 0 !important;
                display: block !important;
                page-break-inside: avoid !important;
            }

            /* Styles additionnels pour le rendu Markdown */
            .content-section blockquote {
                border-left: 4px solid #7c2d12;
                padding-left: 1rem;
                margin: 1rem 0;
                font-style: italic;
                background: rgba(124, 45, 18, 0.05);
            }
    
            .content-section code {
                font-family: monospace;
                background: rgba(0,0,0,0.08);
                padding: 2px 5px;
                border-radius: 3px;
                font-size: 0.9em;
            }
    
            .content-section pre {
                background: #1c1917;
                color: #f4ecd8;
                padding: 1rem;
                border-radius: 4px;
                overflow-x: auto;
                margin: 1rem 0;
            }
    
            .content-section pre code {
                background: transparent;
                color: inherit;
                padding: 0;
            }
        }
    </style>

        let currentDoc = 'intro';

        let expandedSections = new Set();

            html: '',

            term: ''

        const LEGAL_HTML = `

        // === INDEXATION ET RECHERCHE FULL-TEXT ===
        const searchIndex = new Map();
        let isIndexingComplete = false;
        let searchTimeout;

        function normalizeText(text) {
            return text
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^\w\s]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        function extractTextContent(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            doc.querySelectorAll('script, style, nav, .header-actions').forEach(el => el.remove());
            return doc.body.innerText || doc.body.textContent || '';
        }

        async function indexDocument(doc) {
            if (searchIndex.has(doc.id)) return;
            try {
                const response = await fetch(doc.file);
                let rawText = await response.text();
                
                // Si c'est du Markdown, conversion préalable en HTML
                const html = doc.file.endsWith('.md') ? marked.parse(rawText) : rawText;
                
                const parser = new DOMParser();
                const docEl = parser.parseFromString(html, 'text/html');
                
                // Nettoyage des balises non pertinentes
                docEl.querySelectorAll('script, style, nav, .header-actions').forEach(el => el.remove());
                
                const contentBlocks = [];
                let currentH2 = "";
                let currentH3 = "";
                let currentH4 = "";
                
                // Parcourir tous les éléments textuels dans l'ordre exact du document
                const elements = docEl.body.querySelectorAll('h2, h3, h4, p, li, td, th, dt, dd, .rule-item');
                
                elements.forEach(el => {
                    const tagName = el.tagName.toLowerCase();
                    const text = el.textContent.trim().replace(/\s+/g, ' ');
                    if (!text) return;
                    
                    let id = el.id || el.closest('[id^="section-"]')?.id || '';
                    if (!id && tagName.startsWith('h')) {
                        id = 'auto-' + normalizeText(text).substring(0, 20).replace(/\s+/g, '-');
                        el.id = id;
                    }

                    if (tagName === 'h2') {
                        currentH2 = text;
                        currentH3 = "";
                        currentH4 = "";
                        const breadcrumb = [doc.title, currentH2].filter(Boolean).join(' › ');
                        contentBlocks.push({ text, foldedText: foldAccents(text), breadcrumb, isTitle: true, targetId: id });
                    } 
                    else if (tagName === 'h3') {
                        currentH3 = text;
                        currentH4 = "";
                        const breadcrumb = [doc.title, currentH2, currentH3].filter(Boolean).join(' › ');
                        contentBlocks.push({ text, foldedText: foldAccents(text), breadcrumb, isTitle: true, targetId: id });
                    } 
                    else if (tagName === 'h4') {
                        currentH4 = text;
                        const breadcrumb = [doc.title, currentH2, currentH3, currentH4].filter(Boolean).join(' › ');
                        contentBlocks.push({ text, foldedText: foldAccents(text), breadcrumb, isTitle: true, targetId: id });
                    } 
                    else {
                        // Paragraphes, listes, etc.
                        const breadcrumb = [doc.title, currentH2, currentH3, currentH4].filter(Boolean).join(' › ');
                        contentBlocks.push({ text, foldedText: foldAccents(text), breadcrumb, isTitle: false, targetId: '' });
                    }
                });
                
                searchIndex.set(doc.id, {
                    ...doc,
                    contentBlocks: contentBlocks
                });
            } catch (e) {
                console.warn(`Impossible d'indexer ${doc.file}:`, e);
            }
        }

        async function buildSearchIndex() {
            if (isIndexingComplete) return;
            await Promise.all(documents.map(doc => indexDocument(doc)));
            isIndexingComplete = true;
        }

        function foldAccents(str) {
            return str
                .toLowerCase()
                .replace(/[àáâãäå]/g, "a")
                .replace(/[èéêë]/g, "e")
                .replace(/[ìíîï]/g, "i")
                .replace(/[òóôõö]/g, "o")
                .replace(/[ùúûü]/g, "u")
                .replace(/[ç]/g, "c")
                .replace(/[ñ]/g, "n");
        }
        
        function performSearch(query) {
            if (!query || query.length < 2) return [];
            const searchQueryFolded = foldAccents(query.trim());
            if (!searchQueryFolded) return [];
            
            const results = [];
            
            searchIndex.forEach((docData, docId) => {
                const associatedDoc = documents.find(d => d.id === docId);
                if (associatedDoc && associatedDoc.isLore && !loreUnlocked) return;

                if (!docData.contentBlocks) return;

                const matchingItems = [];
                let matchCount = 0;
                const maxMatchesPerDoc = 8;

                for (let block of docData.contentBlocks) {
                    if (matchCount >= maxMatchesPerDoc) break;

                    const pos = block.foldedText.indexOf(searchQueryFolded);
                    if (pos !== -1) {
                        const rawText = block.text;

                        if (block.isTitle) {
                            // Surlignage dans le titre
                            const matchIndexInTitle = block.foldedText.indexOf(searchQueryFolded);
                            const exactWord = rawText.substring(matchIndexInTitle, matchIndexInTitle + searchQueryFolded.length);
                            
                            const highlightedTitle = rawText.replace(
                                exactWord,
                                `<strong style="color:#7c2d12; background:rgba(124,45,18,0.15); padding:0 2px;">${exactWord}</strong>`
                            );

                            matchingItems.push({
                                breadcrumb: block.breadcrumb,
                                snippet: `<strong>${highlightedTitle}</strong>`,
                                targetId: block.targetId,
                                isTitle: true,
                                matchIndex: matchCount
                            });
                        } else {
                            // Extraire 25 caractères avant et après dans le corps du texte
                            const start = Math.max(0, pos - 25);
                            const end = Math.min(rawText.length, pos + searchQueryFolded.length + 25);

                            let prefix = start > 0 ? '...' : '';
                            let suffix = end < rawText.length ? '...' : '';

                            let rawSnippet = rawText.substring(start, end).replace(/\s+/g, ' ');
                            const exactWordInText = rawText.substring(pos, pos + searchQueryFolded.length);

                            const highlightedSnippet = rawSnippet.replace(
                                exactWordInText, 
                                `<strong style="color:#7c2d12; background:rgba(124,45,18,0.15); padding:0 2px; border-radius:2px;">${exactWordInText}</strong>`
                            );

                            matchingItems.push({
                                breadcrumb: block.breadcrumb,
                                snippet: prefix + highlightedSnippet + suffix,
                                targetId: '',
                                isTitle: false,
                                matchIndex: matchCount
                            });
                        }

                        matchCount++;
                    }
                }

                if (matchingItems.length > 0) {
                    results.push({
                        docId: docId,
                        docTitle: docData.title,
                        docIcon: docData.icon,
                        items: matchingItems
                    });
                }
            });
            
            return results;
        }

        function makeAccentInsensitiveRegex(term) {
            const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = escaped
                .replace(/[aàáâãäåAÀÁÂÃÄÅ]/g, '[aàáâãäåAÀÁÂÃÄÅ]')
                .replace(/[eèéêëEÈÉÊË]/g, '[eèéêëEÈÉÊË]')
                .replace(/[iìíîïIÌÍÎÏ]/g, '[iìíîïIÌÍÎÏ]')
                .replace(/[oòóôõöOÒÓÔÕÖ]/g, '[oòóôõöOÒÓÔÕÖ]')
                .replace(/[uùúûüUÙÚÛÜ]/g, '[uùúûüUÙÚÛÜ]')
                .replace(/[cçCÇ]/g, '[cçCÇ]')
                .replace(/[nñNÑ]/g, '[nñNÑ]');
            return new RegExp(`(${pattern})`, 'gi');
        }

        async function navigateToResult(docId, term, matchIndex, targetId) {
            // 1. Charger le document si ce n'est pas celui en cours
            if (currentDoc !== docId) {
                currentDoc = docId;
                expandedId = docId;
                await loadDocument(docId);
            }
            
            // Attente pour stabiliser l'affichage
            await new Promise(resolve => setTimeout(resolve, 100));
            
            // 2. Surligner toutes les occurrences (tolérant aux accents)
            highlightSearchTerm(term);
            
            let targetElement = null;
            
            // 3. Chercher l'élément par ID (titre)
            if (targetId) {
                const cleanId = targetId.replace('section-', '');
                targetElement = document.getElementById(cleanId) || document.getElementById(targetId);
            }
            
            // 4. Si pas d'ID (texte dans un paragraphe), cibler le surlignage correspondant au matchIndex
            const highlights = document.querySelectorAll('.search-highlight');
            if (!targetElement && highlights.length > 0) {
                const idx = (matchIndex !== undefined && matchIndex < highlights.length) ? matchIndex : 0;
                targetElement = highlights[idx];
            }
            
            // 5. Faire défiler jusqu'à la double-page (spread) contenant l'élément
            if (targetElement) {
                const spread = targetElement.closest('.book-spread');
                if (spread) {
                    const mainContainer = document.getElementById('mainContainer');
                    mainContainer.scrollTo({
                        top: spread.offsetTop,
                        behavior: 'smooth'
                    });
                }
            }
        }
        
        function highlightSearchTerm(term) {
            if (!term) return;
            
            // Nettoyer les anciens surlignages
            document.querySelectorAll('.search-highlight').forEach(el => {
                const parent = el.parentNode;
                if (parent) {
                    parent.replaceChild(document.createTextNode(el.textContent), el);
                    parent.normalize();
                }
            });
            
            const regex = makeAccentInsensitiveRegex(term);
            const wrapper = document.getElementById('bookSpreadsWrapper');
            if (!wrapper) return;

            const walker = document.createTreeWalker(
                wrapper,
                NodeFilter.SHOW_TEXT,
                null,
                false
            );
            
            const textNodes = [];
            let node;
            
            while (node = walker.nextNode()) {
                if (node.textContent && regex.test(node.textContent)) {
                    textNodes.push(node);
                }
            }
            
            textNodes.forEach(node => {
                const text = node.textContent;
                regex.lastIndex = 0;
                const parts = text.split(regex);
                if (parts.length <= 1) return;
                
                const fragment = document.createDocumentFragment();
                parts.forEach(part => {
                    regex.lastIndex = 0;
                    if (part && regex.test(part)) {
                        const mark = document.createElement('mark');
                        mark.className = 'search-highlight';
                        mark.style.cssText = 'background-color:#fde047; color:#1c1917; font-weight:bold; border-radius:2px; padding:0 2px; box-shadow:0 0 4px rgba(0,0,0,0.3);';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                
                if (node.parentNode) {
                    node.parentNode.replaceChild(fragment, node);
                }
            });
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            // Réinitialiser la sauvegarde
            searchStateBackup = { html: '', scroll: 0, term: '' };
            renderDocumentsList();

        // MODIFICATION : Ajout des boutons d'action dans la liste des personnages

        function renderDocumentsList() {
            const container = document.getElementById('documentsList');
            const searchTerm = document.getElementById('searchInput').value.trim();
            
            // MODE RECHERCHE ACTIF
            if (searchTerm.length > 2) {
                const results = performSearch(searchTerm);
                
                if (results.length === 0) {
                    container.innerHTML = `
                        <div style="padding:20px; text-align:center; color:#7c2d12; font-style:italic;">
                            Aucun résultat pour "${searchTerm}"<br>
                            <small style="opacity:0.7;">La recherche ignore les accents et majuscules</small>
                        </div>
                        <div style="text-align:center; margin-top:10px;">
                            <button onclick="clearSearch()" style="background:rgba(124,45,18,0.1); border:1px solid #7c2d12; color:#7c2d12; padding:5px 15px; border-radius:4px; cursor:pointer; font-family:'Cinzel',serif; font-size:0.8rem;">
                                ← Retour aux documents
                            </button>

                    `;
                } else {
                    let html = `
                        <div style="padding:10px; margin-bottom:10px; background:rgba(124,45,18,0.1); border-radius:4px; font-size:0.85em; display:flex; justify-content:space-between; align-items:center;">
                            <span><strong>${results.reduce((acc, r) => acc + r.items.length, 0)}</strong> résultat(s)</span>
                            <button onclick="clearSearch()" style="background:none; border:none; cursor:pointer; color:#7c2d12; font-weight:bold; font-size:1.2rem;">×</button>
                        </div>
                    `;
            
                    let pageCounter = 0;
            
                    results.forEach(docResult => {
                        docResult.items.forEach(item => {
                            pageCounter++;
                            const safeTerm = searchTerm.replace(/'/g, "\\'");
                            const borderStyle = item.isTitle ? '3px solid #7c2d12' : '3px solid #a8a29e';
                            
                            html += `
                                <div onclick="navigateToResult('${docResult.docId}', '${safeTerm}', ${item.matchIndex}, '${item.targetId || ''}')" 
                                     style="cursor:pointer; padding:8px; border-left:${borderStyle}; 
                                            background:rgba(0,0,0,0.02); margin-bottom:6px; border-radius:0 4px 4px 0;
                                            font-size:0.8rem; line-height:1.3;"
                                     onmouseover="this.style.background='rgba(124,45,18,0.1)';" 
                                     onmouseout="this.style.background='rgba(0,0,0,0.02)';">
                                    <div style="font-weight:700; color:#7c2d12; font-size:0.7rem; margin-bottom:3px; opacity:0.85;">
                                        ${docResult.docIcon} ${item.breadcrumb}
                                    </div>
                                    <div style="color:#1c1917;">
                                        "${item.snippet}"
                                    </div>
                                </div>
                            `;
                        });
                    });
                
                    searchStateBackup.html = html;
                    searchStateBackup.term = searchTerm;
                    searchStateBackup.scroll = document.querySelector('.sidebar').scrollTop;
                    
                    container.innerHTML = html;
                }
                return;
            }
            
            // MODE NORMAL
            let html = '';
            let renderedLoreFolder = false;

            documents.forEach(doc => {
                if (doc.isLore) {
                    if (!renderedLoreFolder) {
                        renderedLoreFolder = true;
                        const isFolderActive = ['lore_atlas', 'lore_chronologie', 'lore_personnages'].includes(currentDoc);
                        html += `
                            <div class="doc-item">
                                <div class="doc-header ${isFolderActive ? 'active' : ''}" onclick="toggleLoreFolder()">
                                    <span class="doc-icon">🗺️</span>
                                    <div>
                                        <div class="doc-title">Lore</div>
                                        <div class="doc-subtitle">Annexes du Monde</div>
                                    </div>
                                </div>
                                <div class="doc-index ${loreExpanded ? 'expanded' : ''}">
                                    ${renderLoreSubMenu()}
                                </div>
                            </div>
                        `;
                    }
                    return;
                }

                const isActive = doc.id === currentDoc;
                const isExpanded = doc.id === expandedId;
                
                let indexHtml = '';
                if (isActive && isExpanded) {
                    if (doc.id === 'fiche') {
                        indexHtml = renderCharactersList();
                    } else if (currentIndex && currentIndex.length > 0) {
                        indexHtml = currentIndex.map((item, idx, arr) => {
                            if (!item || !item.id) return '';
                            
                            const originalId = item.id;
                            const jsEscapedId = String(item.id).replace(/'/g, "\\'");
                            const safeTitle = String(item.title || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                            
                            const nextItem = arr[idx + 1];
                            const hasChildren = item.level && nextItem && nextItem.level > item.level;
                            
                            let isVisible = item.level === 1;
                            if (item.level > 1) {
                                for (let j = idx - 1; j >= 0; j--) {
                                    if (arr[j].level === item.level - 1) {
                                        isVisible = expandedSections.has(arr[j].id);
                                        break;
                                    }
                                    if (arr[j].level < item.level - 1) break;
                                }
                            }
                            
                            const displayStyle = isVisible ? 'flex' : 'none';
                            const isExpanded = expandedSections.has(originalId);
                            const paddingLeft = item.level ? (8 + (item.level-1)*12) : 8;
                            
                            return `
                                <div class="index-item ${isExpanded ? 'expanded' : ''}" 
                                     data-section="${originalId}" 
                                     data-level="${item.level || 0}"

                                     onclick="toggleIndexItem('${jsEscapedId}', ${hasChildren})">

                            `;
                        }).join('');

                            </div>
                        </div>
                        <div class="doc-index ${isExpanded ? 'expanded' : ''}">

            });

            container.innerHTML = html;

        function checkLorePassword() {
            const input = document.getElementById('lorePasswordInput');
            const error = document.getElementById('loreErrorMsg');
            if (!input) return;

            if (input.value === "Trame-lore") {
                loreUnlocked = true;

            } else {
                if (error) error.style.display = 'block';
                input.value = '';
                input.focus();

        }
        
        function toggleIndexItem(id, hasChildren) {
            // Toujours scroller vers la section
            scrollToElement(id);
            
            // Si l'élément a des enfants, toggle son état développé
            if (hasChildren) {
                if (expandedSections.has(id)) {
                    // 1. On ferme le parent
                    expandedSections.delete(id);
                    
                    // 2. On cherche et on ferme tous ses descendants
                    let foundParent = false;
                    let parentLevel = 0;
                    
                    for (let i = 0; i < currentIndex.length; i++) {
                        const item = currentIndex[i];
                        
                        if (item.id === id) {
                            foundParent = true;
                            parentLevel = item.level;
                            continue; // On passe à l'élément suivant
                        }
                        
                        if (foundParent) {
                            if (item.level > parentLevel) {
                                // C'est un descendant (niveau inférieur), on force sa fermeture
                                expandedSections.delete(item.id);
                            } else {
                                // On est tombé sur le prochain titre de même niveau (ou plus haut), on arrête
                                break;
                            }
                        }
                    }
                } else {
                    // Si on l'ouvre, on l'ajoute simplement
                    expandedSections.add(id);
                }
                renderDocumentsList(); // Re-render pour mettre à jour la visibilité
            }
        }

        function scrollToCharacter(index) {
            const spreadIndex = Math.floor(index / 2);
            const spreads = document.querySelectorAll('.book-spread');
            if (spreads[spreadIndex]) {

        // AJOUT : Fonction pour exporter un personnage depuis la sidebar
        function exportCharacter(id) {
            const profile = TRAME_Registre.getProfile(id);
            if (!profile) return;
            const dataStr = JSON.stringify(profile, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });

        // AJOUT : Fonction pour importer un personnage depuis la sidebar
        function importCharacter(id) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.content && confirm(`Remplacer "${TRAME_Registre.getProfile(id)?.name || 'ce personnage'}" par "${data.name || 'le personnage importé'}" ?`)) {
                            TRAME_Registre.updateProfile(id, data.content, data.name || "Sans Nom");
                            renderDocumentsList();
                            if(currentDoc === 'fiche') loadDocument('fiche');
                            alert('Personnage importé avec succès !');
                        }
                    } catch (err) {
                        alert('Erreur lors de l\'import du fichier JSON');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // AJOUT : Fonction pour imprimer un personnage depuis la sidebar

        function deleteCharacter(id) {

        async function selectDocument(docId) {
            const doc = documents.find(d => d.id === docId);
            
            // Si on clique sur un document normal (pas du Lore), on ferme le dossier Lore
            if (doc && !doc.isLore) {
                loreExpanded = false;
            }

            if (currentDoc === docId) {
                expandedId = (expandedId === docId) ? null : docId;
                renderDocumentsList();
            } else {
                currentDoc = docId;
                expandedId = (doc && doc.isLore) ? null : docId;
                await loadDocument(docId);
            }
        }

        async function loadDocument(docId) {
            expandedSections.clear();
            document.querySelectorAll('style[id^="injected-style-"]').forEach(el => el.remove());
            const doc = documents.find(d => d.id === docId);
            if (!doc) return;

            const wrapper = document.getElementById('bookSpreadsWrapper');
            wrapper.innerHTML = '<div style="padding:40px; text-align:center; color:#7c2d12;">Chargement...</div>';

            if (docId === 'fiche') {
                renderRegistryChapter(doc.file);
                renderDocumentsList();
                return;
            }

            if (docId === 'contact') {
                rawContentCache = "";
                renderContactPage(doc.file);
                renderDocumentsList();
                return;
            }

            try {
                const response = await fetch(doc.file);
                const html = await response.text();
                const parser = new DOMParser();
                const docElement = parser.parseFromString(html, 'text/html');
                
                const indexScript = docElement.getElementById('doc-index');
                currentIndex = indexScript ? JSON.parse(indexScript.textContent).index : [];

                const styles = docElement.querySelectorAll('style');
                styles.forEach(style => {
                    const styleId = style.id || `injected-style-${docId}`;
                    if (!document.getElementById(styleId)) {
                        const clone = style.cloneNode(true);
                        clone.id = styleId;
                        document.head.appendChild(clone);
                    }
                });

                const tempDiv = document.createElement('div');
                let bodyContent = (docElement.body && docElement.body.innerHTML) ? docElement.body.innerHTML : html;
                
                if (doc.file.endsWith('.md')) {
                    bodyContent = marked.parse(bodyContent);
                }

                tempDiv.innerHTML = bodyContent;
                
                tempDiv.querySelectorAll('script, style, link[rel="stylesheet"], meta, title, base, noscript').forEach(el => el.remove());
                
                // Assurer que les titres reçoivent les mêmes ID automatiques que le moteur de recherche
                tempDiv.querySelectorAll('h2, h3, h4').forEach(el => {
                    if (!el.id) {
                        const text = el.textContent.trim().replace(/\s+/g, ' ');
                        el.id = 'auto-' + normalizeText(text).substring(0, 20).replace(/\s+/g, '-');
                    }
                });

                rawContentCache = cleanHtmlContent(tempDiv.innerHTML);
                
                // Attendre les polices ET la fin du rendu des pages avant de résoudre
                await document.fonts.ready;
                await new Promise(resolve => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            paginateContent(rawContentCache);
                            renderDocumentsList();
                            resolve();
                        });
                    });
                });

            } catch (error) {
                console.error('Erreur:', error);
                wrapper.innerHTML = "<p class='page'>Erreur lors du chargement.</p>";
            }
        }

        function cleanHtmlContent(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            
            const removeComments = (node) => {
                for (let i = node.childNodes.length - 1; i >= 0; i--) {
                    const child = node.childNodes[i];
                    if (child.nodeType === 8) {
                        node.removeChild(child);
                    } else if (child.nodeType === 1) {
                        removeComments(child);
                    }
                }
            };
            removeComments(div);
            
            return div.innerHTML;
        }

        function renderContactPage(fileUrl) {
            const wrapper = document.getElementById('bookSpreadsWrapper');
            wrapper.innerHTML = '';
            currentIndex = [];

            const spread = document.createElement('div');
            spread.className = 'book-spread';
            spread.style.overflowX = 'hidden';
            
            const content = `
                <div class="page page-left" style="flex: 1; min-width: 0; padding: 20px; overflow-x: hidden; overflow-y: auto; box-sizing: border-box;">
                    <iframe src="${fileUrl}" style="width: 100%; height: 100%; border: none; background: transparent; display: block; min-width: 0;"></iframe>
                </div>
            `;
            
            spread.innerHTML = content;
            wrapper.appendChild(spread);
        }

        function renderRegistryChapter(baseFileUrl) {
            const wrapper = document.getElementById('bookSpreadsWrapper');
            wrapper.innerHTML = '';
            currentIndex = [];

            const profiles = TRAME_Registre.getAllProfiles();
    
            // Détection en temps réel de la taille d'écran
            const isMobileView = window.innerWidth <= 1024;

            if (profiles.length === 0) {
                TRAME_Registre.createProfile();
                return renderRegistryChapter(baseFileUrl);
            }

            if (isMobileView) {
                // Mode mobile/étroit : une fiche par spread, placée dans .page-right
                // car votre CSS cache .page-left en mode .sheet-mode sur mobile
                profiles.forEach((profile) => {
                    const spread = document.createElement('div');
                    spread.className = 'book-spread sheet-mode';
                    const url = `${baseFileUrl}?uid=${profile.id}`;
            
                    spread.innerHTML = `
                        <div class="page page-right sheet-container-frame">
                            <iframe class="char-sheet-frame" src="${url}"></iframe>
                        </div>
                    `;
                    wrapper.appendChild(spread);
                });
            } else {
                // Mode desktop : deux fiches par spread (gauche + droite)
                for (let i = 0; i < profiles.length; i += 2) {
                    const spread = document.createElement('div');
                    spread.className = 'book-spread sheet-mode';
    
                    const leftProfile = profiles[i];
                    const leftUrl = `${baseFileUrl}?uid=${leftProfile.id}`;
    
                    const leftContent = `
                        <div class="page page-left sheet-container-frame">
                            <iframe class="char-sheet-frame" src="${leftUrl}"></iframe>
                        </div>
                    `;
    
                    let rightContent = '';
                    if (profiles[i + 1]) {
                        const rightProfile = profiles[i + 1];
                        const rightUrl = `${baseFileUrl}?uid=${rightProfile.id}`;
                        rightContent = `
                            <div class="page page-right sheet-container-frame">
                                <iframe class="char-sheet-frame" src="${rightUrl}"></iframe>
                            </div>
                        `;
                    } else {
                        rightContent = `<div class="page page-right"></div>`;
                    }
    
                    spread.innerHTML = leftContent + rightContent;
                    wrapper.appendChild(spread);
                }
            }

            setTimeout(resizeAllSheets, 100);
        }

        function createNewHero() {
            TRAME_Registre.createProfile();
            loadDocument('fiche');
        }

        function deleteHero(id) {
            if(confirm("Êtes-vous certain de vouloir brûler cette page ? Cette action est irréversible.")) {
                TRAME_Registre.deleteProfile(id);
                loadDocument('fiche');
            }
        }

        function resizeAllSheets() {
            const frames = document.querySelectorAll('.char-sheet-frame');
            frames.forEach(iframe => {
                const container = iframe.parentElement;
                if(!container) return;

                const targetW = 794; 
                const targetH = 1123;
        
                const availableH = container.clientHeight; 
                const availableW = container.clientWidth;

                const scale = Math.min(
                    availableH / targetH, 
                    availableW / targetW
                );

                iframe.style.position = 'absolute';
                iframe.style.top = '50%';
                iframe.style.left = '50%';
                iframe.style.width = targetW + 'px';
                iframe.style.height = targetH + 'px';
                iframe.style.transform = `translate(-50%, -50%) scale(${scale})`;
                iframe.style.transformOrigin = 'center center';
            });
        }

        let pgnState = { wrapper: null, currentSpread: null, currentPageContent: null, isRightPage: false, pageCount: 1, elementsQueue: [] };

        function paginateContent(htmlContent) {
            pgnState.wrapper = document.getElementById('bookSpreadsWrapper');
            const staging = document.getElementById('hiddenStaging');
            staging.innerHTML = htmlContent;

            // forcer le calcul immédiat des tailles
            void staging.offsetHeight;
            
            pgnState.wrapper.innerHTML = ''; 
            pgnState.pageCount = 1;
            pgnState.isRightPage = false; 

            createNewSpread();
            
            pgnState.elementsQueue = Array.from(staging.children).filter(el => {
                return !['SCRIPT', 'STYLE', 'LINK', 'META', 'NOSCRIPT', 'TITLE', 'BASE'].includes(el.tagName);
            });

            while (pgnState.elementsQueue.length > 0) {
                let element = pgnState.elementsQueue.shift();
                processElement(element);
            }
            
            removeEmptySpreads();
    
            // Mise à jour finale des numéros au format "p. X/Y"
            const allPages = document.querySelectorAll('.book-spread .page');
            const totalPages = allPages.length;
            allPages.forEach((page, index) => {
                const numEl = page.querySelector('.page-number');
                if (numEl) {
                    numEl.textContent = `p. ${index + 1}/${totalPages}`;
                }
            });
        }

        function injectGiscus() {
            const container = document.querySelector('.giscus-container');
            if (!container) return;
    
            const script = document.createElement('script');
            script.src = "https://giscus.app/client.js";
            script.setAttribute('data-repo', 'Urnidzen/TRAME');
            script.setAttribute('data-repo-id', 'R_kgDORGC3NQ');
            script.setAttribute('data-category', 'Commentaires Site Web');
            script.setAttribute('data-category-id', 'DIC_kwDORGC3Nc4C2FWF');
            script.setAttribute('data-mapping', 'specific');

            script.setAttribute('data-input-position', 'bottom');

            script.setAttribute('data-lang', 'fr');

            script.async = true;
    
            container.appendChild(script);
        }
        
        function createNewSpread() {
            const spread = document.createElement('div');
            spread.className = 'book-spread';
            
            const htmlLeft = `<div class="page page-left"><div class="content-wrapper"></div>${LEGAL_HTML}<div class="page-number">p. ${pgnState.pageCount}/—</div></div>`;
            const htmlRight = `<div class="page page-right"><div class="content-wrapper"></div>${LEGAL_HTML}<div class="page-number">p. ${pgnState.pageCount + 1}/—</div></div>`;

            if (isMobile) spread.innerHTML = htmlLeft;
            else spread.innerHTML = htmlLeft + htmlRight;
            
            pgnState.wrapper.appendChild(spread);
            pgnState.currentSpread = spread;
            pgnState.currentPageContent = spread.querySelector('.page-left .content-wrapper');
            pgnState.isRightPage = false;
            setTimeout(cleanFirstElementMargin, 0);
        }

        function removeEmptySpreads() {
            const spreads = document.querySelectorAll('.book-spread');
            spreads.forEach(spread => {
                const wrappers = spread.querySelectorAll('.content-wrapper');
                const isEmpty = Array.from(wrappers).every(w => {
                    const hasNoChildren = w.children.length === 0;
                    const hasNoVisualContent = w.innerText.trim().length === 0 && w.querySelectorAll('img, table, canvas, svg').length === 0;
                    return hasNoChildren || hasNoVisualContent;
                });
                if (isEmpty) {
                    spread.remove();
                }
            });
            setTimeout(cleanFirstElementMargin, 0);
        }

        function cleanFirstElementMargin() {
            if (!pgnState.currentPageContent) return;
            
            // Trouve le premier vrai élément (pas un texte vide)
            let firstEl = pgnState.currentPageContent.firstElementChild;
            
            // Si c'est un h3 ou h4, on retire sa marge supérieure
            if (firstEl && (firstEl.tagName === 'H2' || firstEl.tagName === 'H3' || firstEl.tagName === 'H4')) {
                firstEl.style.marginTop = '0';
            }
        }
        
        function advancePage() {
            if (isMobile) {
                pgnState.pageCount++;
                createNewSpread();
            } else {
                if (!pgnState.isRightPage) {
                    pgnState.isRightPage = true;
                    pgnState.currentPageContent = pgnState.currentSpread.querySelector('.page-right .content-wrapper');
                } else {
                    pgnState.pageCount += 2;
                    createNewSpread();
                }
            }
            cleanFirstElementMargin();
        }
              
        function processElement(element) {
            // Saut de page forcé
            if (element.classList && element.classList.contains('page-break')) {
                advancePage();
                return;
            }
            
            // Clone et ajout
            let node = element.cloneNode(true);
            pgnState.currentPageContent.appendChild(node);
            void node.offsetHeight;
            
            // Détection de débordement
            if (isOverflowing(pgnState.currentPageContent)) {
                const container = pgnState.currentPageContent;
                container.removeChild(node);
                
                const isPageEmpty = container.children.length === 0;
                
                // Si la page est vide et l'élément est trop gros (tableau, image)
                if (isPageEmpty && (element.tagName === 'TABLE' || element.tagName === 'IMG')) {
                    node.style.maxHeight = '92%';
                    node.style.overflowY = 'auto';
                    container.appendChild(node);
                    advancePage();
                    return;
                }
                
                // Si page vide et texte très long, on le met quand même avec scroll
                if (isPageEmpty) {
                    container.appendChild(node);
                    advancePage();
                    return;
                }
                
                // Sinon, on passe à la page suivante et on remet l'élément
                advancePage();
                pgnState.elementsQueue.unshift(element);
            }
        }

        function handleGiantBlock(element) {
            // Éléments médias ou tableaux : ajouter avec limitation de taille
            const tagName = element.tagName.toLowerCase();
            if (['img', 'video', 'iframe', 'svg', 'table'].includes(tagName)) {
                let node = element.cloneNode(true);
                node.style.maxHeight = "92%";
                node.style.overflowY = "auto";
                pgnState.currentPageContent.appendChild(node);
                advancePage();
                return;
            }
            
            // Éléments avec enfants : décomposer en enfants individuels
            const children = Array.from(element.children);
            if (children.length > 0) {
                // Remettre les enfants dans la queue (ordre inversé pour dépiler correctement)
                for (let i = children.length - 1; i >= 0; i--) {
                    pgnState.elementsQueue.unshift(children[i]);
                }
            } else {
                // Élément simple : l'ajouter avec scroll si nécessaire
                let node = element.cloneNode(true);
                node.style.maxHeight = "92%";
                node.style.overflowY = "auto";
                pgnState.currentPageContent.appendChild(node);
                advancePage();
            }
        }

        function isOverflowing(container) { return container.scrollHeight > container.clientHeight + 2; }

        function scrollToElement(id) {
            const cleanId = id.replace('section-', '');
            // Attendre que le DOM soit stable
            requestAnimationFrame(() => {
                const target = document.getElementById(cleanId) || document.getElementById(id);
                if (!target) {
                    console.warn(`Élément introuvable: #${id}`);
                    return;
                }
        
                const spread = target.closest('.book-spread');
                if (!spread) return;
        
                const mainContainer = document.getElementById('mainContainer');
                mainContainer.scrollTo({
                    top: spread.offsetTop,
                    behavior: 'smooth'
                });
                
                // Optionnel : surligner brièvement la section trouvée
                target.style.backgroundColor = 'rgba(124,45,18,0.2)';
                setTimeout(() => {
                    target.style.backgroundColor = '';
                }, 2000);
            });
        }

        function toggleSidebar() {
            const mainContainer = document.getElementById('mainContainer');
            const currentScrollTop = mainContainer.scrollTop;
            const spreadHeight = window.innerHeight;
            const spreadIndex = Math.floor(currentScrollTop / spreadHeight);
            
            sidebarOpen = !sidebarOpen;
            document.getElementById('sidebarContainer').classList.toggle('closed', !sidebarOpen);
            document.getElementById('mainContainer').classList.toggle('sidebar-closed', !sidebarOpen);
            
            const delay = isMobile ? 600 : 350;
            
            setTimeout(() => { 
                if (currentDoc === 'fiche') {
                    resizeAllSheets();
                } else if (rawContentCache && currentDoc !== 'contact') {
                    // CORRECTION : Sur mobile, pas besoin de repaginer car la sidebar est en overlay
                    // La largeur ne change pas (déjà 100%), donc on évite de détruire les highlights
                    if (!isMobile) {
                        paginateContent(rawContentCache);
                        
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                const spreads = document.querySelectorAll('.book-spread');
                                if (spreads[spreadIndex]) {
                                    mainContainer.scrollTo({
                                        top: spreads[spreadIndex].offsetTop,
                                        behavior: 'instant'
                                    });
                                }
                            });
                        });
                    }
                    // Sur mobile : on ne fait rien, le CSS gère l'affichage et les highlights restent en place
                }
            }, delay);
        }

        function checkMobile() {
            const wasMobile = isMobile;
            isMobile = window.innerWidth <= 1024;
            if (isMobile && sidebarOpen && !wasMobile) toggleSidebar();
            if (wasMobile !== isMobile) {
                 if (currentDoc === 'fiche') loadDocument('fiche');
                 else if (rawContentCache) paginateContent(rawContentCache);
            }
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                checkMobile();
                if (currentDoc === 'fiche') resizeAllSheets();
                else if (rawContentCache) paginateContent(rawContentCache);
            }, 300);
        });

        function setupEventListeners() {
            document.getElementById('tabHandle').addEventListener('click', toggleSidebar);
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    renderDocumentsList();
                }, 300);
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
